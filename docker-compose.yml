# The Elicit platform as one file, for evaluation and development (umbrella C-018): never a
# production installation. Its defaults favor ease of use and are not hardened.
#
# It needs nothing beside it: no module clones, no brand or translation directories, no data
# directory. Download this file and, in its folder, run
#
#   docker compose up -d
#
# Admin: http://localhost:8081 (admin/admin)   Survey: http://localhost:8080
# Author: http://localhost:8084 (author/author)
# Keycloak: http://localhost:8180 (admin/admin)   Mailpit: http://localhost:8025
# Jaeger: http://localhost:16686
#
# One pass, no restarts: Survey creates the schema, Admin migrates on top of it, and FHHS starts
# after Admin is healthy. No survey is seeded. Sign in to Admin, create a department, then apply
# a survey definition under Apply Survey Definition: family-history-survey.elicit from the FHHS
# repository, or a file exported from Author, where Import definition opens
# samples/census-household-survey.template.elicit from the Elicit repository. FHHS reports not
# ready until the Family History survey is applied. The installation manual's "Evaluating with
# Docker Compose" chapter (docs/manual) describes every service, port and volume below.
#
# Out of the box the applications show the default Elicit brand, the one each image embeds, in
# English only. A brand or translations are directories mounted into the applications; the
# commented `volumes` of each one say how.
#
# Data lives in named volumes (`pgdata`, `mailpit-data`, `sftp-data`); Keycloak keeps nothing and
# returns to its built-in accounts whenever its container is recreated. To start over:
#
#   docker compose down -v
#
# Image tag (release). Every Elicit image -- survey, admin, fhhs, pedigree, author, the
# author-survey preview, the database (elicitsoftware/elicit_db) and the identity provider with
# the realm built in (elicitsoftware/elicit_keycloak) -- is pulled at the one tag in ELICIT_TAG,
# so a site runs a matched set and never mixes releases. It defaults to the release this file comes with, never
# `latest`. To run another release, set the tag for one command
#
#   ELICIT_TAG=3.0.0-rc.2 docker compose up -d
#
# or once, in a `.env` file beside this one (ignored by git):
#
#   ELICIT_TAG=3.0.0-rc.2
#
# Development: the local builds (buildDockerImages.sh) are tagged `latest`, so a developer's
# `.env` holds ELICIT_TAG=latest; fullTest.sh sets it itself. Build before the first start:
# Docker pulls an image it does not have, and the `latest` of elicit_db on Docker Hub predates
# 1.0.0, while elicit_keycloak has no `latest` there at all.
#
# The same `.env` file may set ELICIT_SERVICE_TOKEN, the token the modules authenticate each
# other with. Unset, every service gets the development value written below, which is
# published and not for a real site; a value of your own (openssl rand -hex 32, at least 32
# characters) replaces it for every service at once.
#
# A pre-release (3.0.0-rc.2) is published under its exact version only; `latest`
# and `3.0` move only when a final version ships, so a pre-release is reachable only by naming it.
# The database and identity provider images are released with every platform version from
# 3.0.0-rc.2 on; an earlier ELICIT_TAG has neither.

# The project name, whatever the folder is called: containers are elicit-<service>-1 and the
# volumes elicit_pgdata, elicit_mailpit-data and elicit_sftp-data (resetDatabase.sh relies on it).
name: elicit

services:
  survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-3.0.0-rc.2}
    # Docker Desktop resolves host.docker.internal inside a container; Docker Engine on Linux
    # does not, so the services that call the Family History addresses map it themselves.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8080:8080
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: ${ELICIT_SERVICE_TOKEN:-elicit-dev-service-token-not-for-a-real-site}
      # The Family History definition names its report and post-survey action addresses as
      # http://host.docker.internal:8082/..., so that origin is the one the token may be sent to.
      ELICIT_SERVICE_TRUSTED_ORIGINS: http://host.docker.internal:8082
      TZ: America/Detroit
      # AutoRegister allows for users to type in any access code for testing.
      # The Admin tool is used to create access codes and manage respondents.
      # Remove this for production, the default is false.
      accessCode.autoRegister: true
      # Brand and translations: off, so the application shows its embedded default brand in
      # English. To mount them, uncomment the two settings here and the `volumes` below.
      # brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      # i18n.file.system.path: /opt/i18n
      # Survey's connection is survey_user and its migrating connection elicit_owner; both
      # passwords are SURVEYPW in the database image's role script.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # OpenTelemetry configuration
      quarkus.application.name: survey
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: survey
      OTEL_RESOURCE_ATTRIBUTES: service.name=survey,service.version=${ELICIT_TAG:-3.0.0-rc.2},deployment.environment=local
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    # A brand and translations are directories beside this file, mounted read-only. The umbrella
    # repository carries the default brand (elicit-brand/) and the curated translations
    # (elicit-i18n/: Latin American Spanish and Arabic); a site mounts its own in their place.
    # Uncomment these and the two settings above, then `docker compose up -d`.
    # volumes:
    #   - ./elicit-brand/:/opt/brand:ro
    #   - ./elicit-i18n/:/opt/i18n:ro
    #   - ../Elicit_Campsites/um-brand/:/opt/brand:ro
    #   - ../Kindred/kindred-brand/:/opt/brand:ro
    #   - ./test-partial-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
  fhhs:
    image: elicitsoftware/fhhs:${ELICIT_TAG:-3.0.0-rc.2}
    # Docker Desktop resolves host.docker.internal inside a container; Docker Engine on Linux
    # does not, so the services that call the Family History addresses map it themselves.
    extra_hosts:
      - host.docker.internal:host-gateway
    # This port is needed, not only for local testing: the shipped Family History definition
    # names its reports and its post-survey action at http://host.docker.internal:8082/..., so
    # Survey and Admin reach FHHS through the published port. Every path outside /q requires the
    # service token.
    ports:
      - 8082:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 90s
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: ${ELICIT_SERVICE_TOKEN:-elicit-dev-service-token-not-for-a-real-site}
      # The Family History definition names its report and post-survey action addresses as
      # http://host.docker.internal:8082/..., so that origin is the one the token may be sent to.
      ELICIT_SERVICE_TRUSTED_ORIGINS: http://host.docker.internal:8082
      TZ: America/Detroit
      pedigree.url: http://pedigree:8080/svg
      # FHHS connects as survey_user and migrates as elicit_owner, like Survey.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      family.history.sftp.enabled: false
      # family.history.sftp.enabled: true
      # family.history.sftp.host: sftpServer
      # # SFTP Authentication settings there are two options for authentication
      # # 1. Password Authentication - set family.history.sftp.username and family.history.sftp.password
      # # 2. SSH Key Authentication - set family.history.sftp.username and family.history.sftp.privateKey
      # #
      # # See FHHS/SSH_AUTHENTICATION_GUIDE.md for more information on setting up SSH Key Authentication.
      # #
      # # family.history.sftp.privateKey can be either the path to the private key file
      # # or the private key itself. If using the path make sure the file is mounted as a volume.
      # # family.history.sftp.privateKey:
      # family.history.sftp.username: fhhs_user
      # family.history.sftp.password: pass
      # # family.history.sftp.privateKey: /ssh/fhhs_user
      # # family.history.sftp.privateKey: |+
      # #   -----BEGIN RSA PRIVATE KEY-----     
      # #   Put the key here. 
      # #   -----END RSA PRIVATE KEY-----
      # family.history.sftp.path: /upload/reports
      # family.history.sftp.port: 22
      # # The bundled sftpServer makes a new host key each start, so there is none to pin.
      # # A real server needs family.history.sftp.knownHosts instead (ssh-keyscan output).
      # family.history.sftp.strictHostKeyChecking: false
      # family.history.upload.psa.id: 1
      # family.history.sftp.xml.template: |+
      #   <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      #   <umhsdoc2>
      #       <imageSource>MiGHT</imageSource>
      #       <updateFlag>N</updateFlag>
      #       <externalSourceId>{RespondentId}</externalSourceId>
      #       <mrn>{Xid}</mrn>
      #       <formDesignatorNum>38670</formDesignatorNum>
      #       <docDate>{Finalized}</docDate>
      #       <pages>
      #           <page>{Xid}.pdf</page>
      #       </pages>
      #   </umhsdoc2>
      # OpenTelemetry configuration
      quarkus.application.name: fhhs
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: fhhs
      OTEL_RESOURCE_ATTRIBUTES: service.name=fhhs,service.version=${ELICIT_TAG:-3.0.0-rc.2},deployment.environment=local
    depends_on:
      db:
        condition: service_healthy
      survey:
        condition: service_healthy
      # After Admin, not beside it: on a fresh database FHHS's V0.0.4 and Admin's first
      # migration grant on the same tables at the same moment and one of them fails with
      # "tuple concurrently updated" (seen on 2026-10-03 in the multilingual suite's Mexico
      # site). Admin needs nothing from FHHS at startup, so the dependency runs this way round.
      admin:
        condition: service_healthy
      sftpServer:
        condition: service_started
    # volumes:
      # - ./sftp_ssh/fhhs_user:/ssh/fhhs_user:ro        
  # premm5 (not cloned by cloneAllProjects.sh; see CLAUDE.md).
  # NOTE before re-enabling: the healthcheck must probe the container-internal 8080 like every
  # other service here, not the published one. 8084 and 8085 are Author's, so 8086 is free.
  # premm5:
  #   image: elicitsoftware/premm5:${ELICIT_TAG:-3.0.0-rc.2}
  #   #open this port for local testing. It is not needed for inter container communication.
  #   ports:
  #     - 8086:8080
  #   healthcheck:
  #       test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
  #       interval: 15s
  #       timeout: 5s
  #       retries: 20
  #       start_period: 45s
  #   environment:
  #     TZ: America/Detroit
  #     truelicense.store.file: /license/PREMM5.license
  #     # OpenTelemetry configuration
  #     quarkus.application.name: premm5
  #     quarkus.otel.enabled: true
  #     quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
  #     quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
  #     quarkus.otel.traces.enabled: true
  #     quarkus.otel.metrics.enabled: true
  #     quarkus.otel.logs.enabled: true
  #     OTEL_SERVICE_NAME: premm5
  #     OTEL_RESOURCE_ATTRIBUTES: service.name=premm5,service.version=${ELICIT_TAG:-3.0.0-rc.2},deployment.environment=local
  #   depends_on:
  #     # db:
  #     #   condition: service_healthy
  #     survey:
  #       condition: service_healthy
  #   volumes:
  #     - ./PREMM5/PREMM5.license:/license/PREMM5.license:ro
  pedigree:
    image: elicitsoftware/pedigree:${ELICIT_TAG:-3.0.0-rc.2}
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: ${ELICIT_SERVICE_TOKEN:-elicit-dev-service-token-not-for-a-real-site}
    # Open this port for local testing. It is not needed for inter container communication:
    # FHHS reaches Pedigree at pedigree:8080. Every path but /healthz requires the service token.
    ports:
      - 8083:8080
  admin:
    image: elicitsoftware/admin:${ELICIT_TAG:-3.0.0-rc.2}
    # Docker Desktop resolves host.docker.internal inside a container; Docker Engine on Linux
    # does not, so the services that call the Family History addresses map it themselves.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8081:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: ${ELICIT_SERVICE_TOKEN:-elicit-dev-service-token-not-for-a-real-site}
      # The Family History definition names its report and post-survey action addresses as
      # http://host.docker.internal:8082/..., so that origin is the one the token may be sent to.
      ELICIT_SERVICE_TRUSTED_ORIGINS: http://host.docker.internal:8082
      TZ: America/Detroit
      quarkus.mailer.from: elicit@localhost
      quarkus.mailer.host: mailpit
      quarkus.mailer.port: 1025
      quarkus.mailer.tls: false
      # Brand and translations: off, so the application shows its embedded default brand in
      # English. To mount them, uncomment the two settings here and the `volumes` below.
      # brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      # i18n.file.system.path: /opt/i18n
      ELICIT_DB_PASSWORD: SAOWNERPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # Where the container reaches Keycloak; the browser is sent to http://localhost:8180
      # (KC_HOSTNAME on the keycloak service).
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/elicit/
      
      # DATABASE sources roles from survey.user_roles (managed via the Edit User
      # screen) instead of relying solely on OIDC/Keycloak. Default is OIDC.
      # elicit.authorization.mode: DATABASE

      # quarkus.mailer.auth-methods:
      # quarkus.mailer.username:
      # quarkus.mailer.password=
      # OpenTelemetry configuration
      quarkus.application.name: admin
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: admin
      OTEL_RESOURCE_ATTRIBUTES: service.name=admin,service.version=${ELICIT_TAG:-3.0.0-rc.2},deployment.environment=local
    # A brand and translations are directories beside this file, mounted read-only. The umbrella
    # repository carries the default brand (elicit-brand/) and the curated translations
    # (elicit-i18n/: Latin American Spanish and Arabic); a site mounts its own in their place.
    # Uncomment these and the two settings above, then `docker compose up -d`.
    # volumes:
    #   - ./elicit-brand/:/opt/brand:ro
    #   - ./elicit-i18n/:/opt/i18n:ro
    #   - ../Elicit_Campsites/um-brand/:/opt/brand:ro
    #   - ../Kindred/kindred-brand/:/opt/brand:ro
    #   - ./test-partial-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
      survey:
        condition: service_healthy
      keycloak:
        condition: service_started
      pedigree:
        condition: service_started
# -----------------------------------------------------------------------------
# Author stack
# The authoring tool works in a database of its own -- `author`, a second database
# in the same Postgres container, created by the `create-author-database` config at the foot
# of this file when the cluster is first initialized -- so drafts never touch the site's survey
# data:
#   author-survey - a second Survey container pointed at db/author. Survey owns
#                   the schema migrations, so this is what creates the survey
#                   schema there; it also serves as the respondent preview of a
#                   survey being authored (host port 8085, any access code works)
#   author        - the authoring tool (host port 8084)
# Keycloak and Jaeger are shared with the rest of the stack.
# Authoring needs none of the site applications: `docker compose up -d author keycloak jaeger`
# runs just this side (author pulls in author-survey and db). For Author in dev mode on 8084,
# start everything it calls instead: `docker compose up -d db keycloak author-survey`.
# A `pgdata` volume initialized before Author joined the stack does not get the `author`
# database automatically: run db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql once (see the comment
# at the top of that file) or start over with `docker compose down -v`.
# -----------------------------------------------------------------------------
  author-survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-3.0.0-rc.2}
    ports:
      - 8085:8080
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: ${ELICIT_SERVICE_TOKEN:-elicit-dev-service-token-not-for-a-real-site}
      TZ: America/Detroit
      # Preview only: an author types any access code to walk through a draft.
      accessCode.autoRegister: true
      # Preview only: the reporting ETL stays off. Every survey would get a reporting schema
      # of its own (Survey UC-008), so nothing collides any more; it is off because nothing
      # reports on preview answers yet. The reporting work turns it on when it needs the
      # preview to model what a site builds. The drop below is what UC-047 calls before
      # deleting a survey, so a schema never outlives its survey once the ETL is on.
      elicit.etl.enabled: "false"
      elicit.etl.drop.enabled: "true"
      # The preview connects as survey_user and migrates as elicit_owner, like Survey; the
      # roles are cluster-wide, so the author database takes the same passwords.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # Brand and translations: off, so the application shows its embedded default brand in
      # English. To mount them, uncomment the two settings here and the `volumes` below.
      # brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      # i18n.file.system.path: /opt/i18n
      # Both of Survey's datasources move from the `survey` database to `author`.
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      quarkus.datasource.owner.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      # OpenTelemetry configuration
      quarkus.application.name: author-survey
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: author-survey
      OTEL_RESOURCE_ATTRIBUTES: service.name=author-survey,service.version=${ELICIT_TAG:-3.0.0-rc.2},deployment.environment=local
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    # A brand and translations are directories beside this file, mounted read-only. The umbrella
    # repository carries the default brand (elicit-brand/) and the curated translations
    # (elicit-i18n/: Latin American Spanish and Arabic); a site mounts its own in their place.
    # Uncomment these and the two settings above, then `docker compose up -d`.
    # volumes:
    #   - ./elicit-brand/:/opt/brand:ro
    #   - ./elicit-i18n/:/opt/i18n:ro
    #   - ../Elicit_Campsites/um-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
  author:
    image: elicitsoftware/author:${ELICIT_TAG:-3.0.0-rc.2}
    ports:
      - 8084:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: ${ELICIT_SERVICE_TOKEN:-elicit-dev-service-token-not-for-a-real-site}
      TZ: America/Detroit
      # Brand and translations: off, so the application shows its embedded default brand in
      # English. To mount them, uncomment the two settings here and the `volumes` below.
      # brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      # i18n.file.system.path: /opt/i18n
      # The preview Survey, which drops a survey's reporting schema before Author deletes it (UC-047).
      author.preview.survey.url: http://author-survey:8080
      # The preview as an author's browser opens it, for Reports > Preview in Survey… (Author UC-048 BR-007).
      author.preview.survey.public-url: http://localhost:8085
      # Author connects as survey_user (Survey's grants cover every definition table)
      # to the `author` database; the schema there is created by author-survey.
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      ELICIT_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # Where the container reaches Keycloak. The browser never sees this address: Keycloak
      # answers with the public one, http://localhost:8180 (KC_HOSTNAME on the keycloak service),
      # so no host needs a hosts entry to sign in.
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/elicit/
      # OpenTelemetry configuration
      quarkus.application.name: author
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: author
      OTEL_RESOURCE_ATTRIBUTES: service.name=author,service.version=${ELICIT_TAG:-3.0.0-rc.2},deployment.environment=local
    # A brand and translations are directories beside this file, mounted read-only. The umbrella
    # repository carries the default brand (elicit-brand/) and the curated translations
    # (elicit-i18n/: Latin American Spanish and Arabic); a site mounts its own in their place.
    # Uncomment these and the two settings above, then `docker compose up -d`.
    # volumes:
    #   - ./elicit-brand/:/opt/brand:ro
    #   - ./elicit-i18n/:/opt/i18n:ro
    #   - ../Elicit_Campsites/um-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
      author-survey:
        condition: service_healthy
      keycloak:
        condition: service_started
# Test containers
# These containers are used for running the application in a development environment.
# They are not needed for production or will be replaced by non containerized applications.
## Postgres Database
  db:
    # With ELICIT_TAG=latest this is the local build (./buildDockerImages.sh elicit_db), never
    # the `latest` on Docker Hub, which predates 1.0.0 (see the header).
    image: elicitsoftware/elicit_db:${ELICIT_TAG:-3.0.0-rc.2}
    # The data persists between starts in the named volume `pgdata`. To start over with an empty
    # database, `docker compose down -v` (or ./resetDatabase.sh V3 in the umbrella repository).
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      # Adds the `author` database (Author stack). Runs only when the cluster is first
      # initialized, that is, on an empty `pgdata` volume.
      - source: create-author-database
        target: /docker-entrypoint-initdb.d/V0.0.4__CREATE_AUTHOR_DATABASE.sql
    # Open for local work (an IDE's database tools, a module in dev mode). It is not needed for
    # inter container communication: the applications reach the database at db:5432.
    ports:
      - 5452:5432
    environment:
      TZ: "America/Detroit"    
      POSTGRES_USER: "survey"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey && psql -U survey -d survey -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
# OIDC Server
# A Keycloak server for evaluating and testing the OIDC integration, with the Elicit realm built
# in (keycloak/Dockerfile in the umbrella repository): the clients Admin and Author sign in
# through and the accounts admin/admin, user/user and author/author. It imports the realm on
# every start of a new container and keeps nothing. A change to keycloak/elicit-realm.json
# reaches a local stack through `./buildDockerImages.sh Keycloak` (tagged `latest`).
  keycloak:
    image: elicitsoftware/elicit_keycloak:${ELICIT_TAG:-3.0.0-rc.2}
    ports:
      - "8180:8080"
    environment:
      TZ: "America/Detroit"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The address a browser uses, which Keycloak puts in every sign-in redirect and names as
      # the issuer of its tokens. Admin and Author call it at http://keycloak:8080; the second
      # setting lets it answer those calls at the address they came in on. A module in dev mode
      # on the host uses http://localhost:8180 for both.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
# SMTP Server
# This is a Mailpit server that is used for testing the email integration.    
# visit http://localhost:8025/ to view the emails sent by the application.
  mailpit:
    image: axllent/mailpit:v1.34.0
    volumes:
      - mailpit-data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      TZ: "America/Detroit"
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
# SFTP Server
# This is a SFTP server that is used for testing the SFTP integration.      
  sftpServer:
    # Pinned by digest: the image publishes only floating tags.
    image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
    # Not published on the host: FHHS reaches it at sftpServer:22. Uncomment to look at the
    # uploads with an SFTP client (fhhs_user / pass).
    # ports:
    #   - "22:22"
    environment:
      TZ: "America/Detroit"
      SFTP_USERS: fhhs_user:pass:::upload/reports
    volumes:
      - sftp-data:/home/fhhs_user/upload/reports
      # For SSH key authentication (FHHS/SSH_AUTHENTICATION_GUIDE.md), mount the public key:
      # - ./sftp_ssh/fhhs_user.pub:/home/fhhs_user/.ssh/authorized_keys:ro
# OpenTelemetry Tracing
# Jaeger - Distributed tracing UI and backend
# Visit http://localhost:16686 to view traces
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      TZ: "America/Detroit"
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  pgdata:
  mailpit-data:
  sftp-data:

configs:
  # A copy of db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql, inline so this file needs nothing beside it.
  # Keep the two identical. When elicit_db carries the script itself, remove this copy in the
  # same release: the image would run both, and the second CREATE DATABASE stops the
  # initialization.
  create-author-database:
    content: |
      CREATE DATABASE author;
      GRANT CONNECT ON DATABASE author TO dbowner;
      GRANT CREATE ON DATABASE author TO dbowner;
      GRANT CONNECT ON DATABASE author TO dbuser;
      \c author

      GRANT USAGE, CREATE ON SCHEMA public TO dbowner;
      GRANT USAGE ON SCHEMA public TO dbuser;

      CREATE SCHEMA survey AUTHORIZATION elicit_owner;
      GRANT USAGE ON SCHEMA survey TO survey_user;
      GRANT USAGE ON SCHEMA survey TO surveyadmin_user;
      GRANT USAGE ON SCHEMA survey TO surveyreport_user;

      CREATE SCHEMA surveyreport AUTHORIZATION elicit_owner;
      GRANT USAGE ON SCHEMA surveyreport TO surveyreport_user;
      GRANT USAGE ON SCHEMA surveyreport TO surveyadmin_user;
      GRANT USAGE ON SCHEMA surveyreport TO survey_user;

      GRANT USAGE, CREATE ON SCHEMA surveyreport TO dbowner;
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA surveyreport TO dbowner;
      ALTER DEFAULT PRIVILEGES IN SCHEMA surveyreport GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO dbowner;
      GRANT USAGE ON ALL SEQUENCES IN SCHEMA surveyreport TO dbowner;
      ALTER DEFAULT PRIVILEGES IN SCHEMA surveyreport GRANT USAGE ON SEQUENCES TO dbowner;
