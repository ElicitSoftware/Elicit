#This file will setup a docker network named elicit (or what ever directory it is run from)
# It will then create 4 containers:
#   1. db - postgres database
#   2. survey - the survey application
#   3. fhhs - the family health history survey
#   4. pedigree - the service for drawing pedigrees
#
# The containers initialize the database when they start.
# However, they need to run in the correct order.
# When the Survey container starts it will create the database tables.
# When the FHHS container starts it will insert the data for the Family Health History Survey.
# The FHHS will fail as it is trying to build database views based on the Dimensional data tables in the database
# that do not exist yet.
# When you restart the Survey container it will create the Dimensional database tables used for the new survey
# for use in reporting.
# Then when the FHHS container is restarted it should find the tables and create the views.
#
# So in order for the application to be fully configured you will need to start the containers multiple times using the following commands:
# 1. docker-compose up -d
# 2. Wait for 30 seconds or until the FHHS container stops.
# 2. docker-compose restart
# 2. Wait for 30 seconds or until the FHHS container stops.
# 3. docker-compose restart
#
# For Mac and Linux users these can be combined into a single command:
# docker compose up -d && sleep 25 && docker compose restart && sleep 25 && docker compose restart && sleep 25 && echo "Initialization complete Please visit http://localhost:8080"
#
# For Windows users you can use the following command:
# docker-compose up -d && timeout /t 25 && docker-compose restart && timeout /t 25 && docker-compose restart && timeout /t 25 && echo "Initialization complete Please visit http://localhost:8080"
#
# The application will be available at the following URL: http://localhost:8080
#

# Image tag (release). Every Elicit application image -- survey, admin, fhhs, pedigree,
# author and the author-survey preview -- is pulled at the one tag in ELICIT_TAG, so a site
# runs a matched set and never mixes releases.
# It defaults to `latest`, which is what the local builds (buildDockerImages.sh) are tagged with.
# To run a published release, set the tag to its version, either for one command
#
#   ELICIT_TAG=3.0.0-beta.1 docker compose up -d
#
# or once, in a `.env` file beside this one (ignored by git):
#
#   ELICIT_TAG=3.0.0-beta.1
#
# A pre-release (3.0.0-beta.1, 3.0.0-rc.1) is published under its exact version only; `latest`
# and `3.0` move only when a final version ships, so a beta is reachable only by naming it.
# The database image, elicitsoftware/elicit_db, is versioned on its own and is not covered.

services:
  survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-latest}
    ports:
      - 8080:8080
    environment:
      TZ: America/Detroit
      # AutoRegister allows for users to type in any access code for testing.
      # The Admin tool is used to create access codes and manage respondents.
      # Remove this for production, the default is false.
      accessCode.autoRegister: true
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      # Survey's connection is survey_user and its migrating connection elicit_owner; both
      # passwords are SURVEYPW in the database image's role script.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # OpenTelemetry configuration
      quarkus.application.name: survey
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: survey
      OTEL_RESOURCE_ATTRIBUTES: service.name=survey,service.version=1.0,deployment.environment=local
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    volumes:
      - ./elicit-brand/:/opt/brand:ro
      - ./elicit-i18n/:/opt/i18n:ro
      # - ../Elicit_Campsites/um-brand/:/opt/brand:ro
      # - ../Kindred/kindred-brand/:/opt/brand:ro
      # - ./test-partial-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
  fhhs:
    image: elicitsoftware/fhhs:${ELICIT_TAG:-latest}
    #open this port for local testing. It is not needed for inter container communication.
    ports:
      - 8082:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 90s
    environment:
      TZ: America/Detroit
      pedigree.url: http://pedigree:8080/svg
      # FHHS connects as survey_user and migrates as elicit_owner, like Survey.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      family.history.sftp.enabled: false
      # family.history.sftp.enabled: true
      # family.history.sftp.host: sftpServer
      # # SFTP Authentication settings there are two options for authentication
      # # 1. Password Authentication - set family.history.sftp.username and family.history.sftp.password
      # # 2. SSH Key Authentication - set family.history.sftp.username and family.history.sftp.privateKey
      # #
      # # See FHHS/SSH_AUTHENTICATION_GUIDE.md for more information on setting up SSH Key Authentication.
      # #
      # # family.history.sftp.privateKey can be either the path to the private key file
      # # or the private key itself. If using the path make sure the file is mounted as a volume.
      # # family.history.sftp.privateKey:
      # family.history.sftp.username: fhhs_user
      # family.history.sftp.password: pass
      # # family.history.sftp.privateKey: /ssh/fhhs_user
      # # family.history.sftp.privateKey: |+
      # #   -----BEGIN RSA PRIVATE KEY-----     
      # #   Put the key here. 
      # #   -----END RSA PRIVATE KEY-----
      # family.history.sftp.path: /upload/reports
      # family.history.sftp.port: 22
      # # The bundled sftpServer makes a new host key each start, so there is none to pin.
      # # A real server needs family.history.sftp.knownHosts instead (ssh-keyscan output).
      # family.history.sftp.strictHostKeyChecking: false
      # family.history.upload.psa.id: 1
      # family.history.sftp.xml.template: |+
      #   <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      #   <umhsdoc2>
      #       <imageSource>MiGHT</imageSource>
      #       <updateFlag>N</updateFlag>
      #       <externalSourceId>{RespondentId}</externalSourceId>
      #       <mrn>{Xid}</mrn>
      #       <formDesignatorNum>38670</formDesignatorNum>
      #       <docDate>{Finalized}</docDate>
      #       <pages>
      #           <page>{Xid}.pdf</page>
      #       </pages>
      #   </umhsdoc2>
      # OpenTelemetry configuration
      quarkus.application.name: fhhs
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: fhhs
      OTEL_RESOURCE_ATTRIBUTES: service.name=fhhs,service.version=1.0,deployment.environment=local
    depends_on:
      db:
        condition: service_healthy
      survey:
        condition: service_healthy
      # After Admin, not beside it: on a fresh database FHHS's V0.0.4 and Admin's first
      # migration grant on the same tables at the same moment and one of them fails with
      # "tuple concurrently updated" (seen on 2026-10-03 in the multilingual suite's Mexico
      # site). Admin needs nothing from FHHS at startup, so the dependency runs this way round.
      admin:
        condition: service_healthy
      sftpServer:
        condition: service_started
    # volumes:
      # - ./sftp_ssh/fhhs_user:/ssh/fhhs_user:ro        
  # premm5 (not cloned by cloneAllProjects.sh; see CLAUDE.md).
  # NOTE before re-enabling: the healthcheck must probe the container-internal 8080 like every
  # other service here, not the published one. 8084 and 8085 are Author's, so 8086 is free.
  # premm5:
  #   image: elicitsoftware/premm5:${ELICIT_TAG:-latest}
  #   #open this port for local testing. It is not needed for inter container communication.
  #   ports:
  #     - 8086:8080
  #   healthcheck:
  #       test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
  #       interval: 15s
  #       timeout: 5s
  #       retries: 20
  #       start_period: 45s
  #   environment:
  #     TZ: America/Detroit
  #     truelicense.store.file: /license/PREMM5.license
  #     # OpenTelemetry configuration
  #     quarkus.application.name: premm5
  #     quarkus.otel.enabled: true
  #     quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
  #     quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
  #     quarkus.otel.traces.enabled: true
  #     quarkus.otel.metrics.enabled: true
  #     quarkus.otel.logs.enabled: true
  #     OTEL_SERVICE_NAME: premm5
  #     OTEL_RESOURCE_ATTRIBUTES: service.name=premm5,service.version=1.0,deployment.environment=local
  #   depends_on:
  #     # db:
  #     #   condition: service_healthy
  #     survey:
  #       condition: service_healthy
  #   volumes:
  #     - ./PREMM5/PREMM5.license:/license/PREMM5.license:ro
  pedigree:
    image: elicitsoftware/pedigree:${ELICIT_TAG:-latest}
    #open this port for local testing. It is not needed for inter container communication.
    ports:
      - 8083:8080
  admin:
    image: elicitsoftware/admin:${ELICIT_TAG:-latest}
    ports:
      - 8081:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    environment:
      TZ: America/Detroit
      quarkus.mailer.from: elicit@localhost
      quarkus.mailer.host: mailpit
      quarkus.mailer.port: 1025
      quarkus.mailer.tls: false
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      ELICIT_DB_PASSWORD: SAOWNERPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      
      # DATABASE sources roles from survey.user_roles (managed via the Edit User
      # screen) instead of relying solely on OIDC/Keycloak. Default is OIDC.
      # elicit.authorization.mode: DATABASE

      # quarkus.mailer.auth-methods:
      # quarkus.mailer.username:
      # quarkus.mailer.password=
      # OpenTelemetry configuration
      quarkus.application.name: admin
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: admin
      OTEL_RESOURCE_ATTRIBUTES: service.name=admin,service.version=1.0,deployment.environment=local
    volumes:
      - ./elicit-brand/:/opt/brand:ro
      - ./elicit-i18n/:/opt/i18n:ro
      # - ../Elicit_Campsites/um-brand/:/opt/brand:ro
      # - ../Kindred/kindred-brand/:/opt/brand:ro
      # - ./test-partial-brand/:/brand:ro                
    depends_on:
      db:
        condition: service_healthy
      survey:
        condition: service_healthy
      pedigree:
        condition: service_started
# -----------------------------------------------------------------------------
# Author stack
# The authoring tool works in a database of its own -- `author`, a second database
# in the same Postgres container, created by ./db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql
# when the cluster is first initialized -- so drafts never touch the site's survey data:
#   author-survey - a second Survey container pointed at db/author. Survey owns
#                   the schema migrations, so this is what creates the survey
#                   schema there; it also serves as the respondent preview of a
#                   survey being authored (host port 8085, any access code works)
#   author        - the authoring tool (host port 8084)
# Keycloak, Jaeger and the brand assets are shared with the rest of the stack.
# Authoring needs none of the site applications: `docker compose up -d author keycloak jaeger`
# runs just this side (author pulls in author-survey and db). For Author in dev mode on 8084,
# start everything it calls instead: `docker compose up -d db keycloak author-survey`.
# An existing ./postgresql/PGDATA does not get the `author` database automatically:
# run the init script once (see the comment at the top of that file) or reset PGDATA.
# -----------------------------------------------------------------------------
  author-survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-latest}
    ports:
      - 8085:8080
    environment:
      TZ: America/Detroit
      # Preview only: an author types any access code to walk through a draft.
      accessCode.autoRegister: true
      # Preview only: the reporting ETL stays off. Every survey would get a reporting schema
      # of its own (Survey UC-008), so nothing collides any more; it is off because nothing
      # reports on preview answers yet. The reporting work turns it on when it needs the
      # preview to model what a site builds. The drop below is what UC-047 calls before
      # deleting a survey, so a schema never outlives its survey once the ETL is on.
      elicit.etl.enabled: "false"
      elicit.etl.drop.enabled: "true"
      brand.file.system.path: /opt/brand
      # The preview connects as survey_user and migrates as elicit_owner, like Survey; the
      # roles are cluster-wide, so the author database takes the same passwords.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      # Both of Survey's datasources move from the `survey` database to `author`.
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      quarkus.datasource.owner.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      # OpenTelemetry configuration
      quarkus.application.name: author-survey
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: author-survey
      OTEL_RESOURCE_ATTRIBUTES: service.name=author-survey,service.version=1.0,deployment.environment=local
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    volumes:
      - ./elicit-brand/:/opt/brand:ro
      - ./elicit-i18n/:/opt/i18n:ro
      # - ../Elicit_Campsites/um-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
  author:
    image: elicitsoftware/author:${ELICIT_TAG:-latest}
    ports:
      - 8084:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    environment:
      TZ: America/Detroit
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      # The preview Survey, which drops a survey's reporting schema before Author deletes it (UC-047).
      author.preview.survey.url: http://author-survey:8080
      # Author connects as survey_user (Survey's grants cover every definition table)
      # to the `author` database; the schema there is created by author-survey.
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      ELICIT_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # The OIDC URL is left at the image default, http://host.docker.internal:8180/realms/elicit/,
      # the same one Admin uses. It has to work from both places the browser and the container reach
      # Keycloak: the container resolves host.docker.internal to the Docker host, where Keycloak is
      # published on 8180, and Docker Desktop maps the same name to 127.0.0.1 on the host. Pointing
      # it at http://keycloak:8080 instead breaks the login redirect - the browser cannot reach the
      # compose-internal name, and on a host with a "127.0.0.1 keycloak" hosts entry it lands on
      # Survey, which listens on 8080.
      # OpenTelemetry configuration
      quarkus.application.name: author
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: author
      OTEL_RESOURCE_ATTRIBUTES: service.name=author,service.version=3.0.0,deployment.environment=local
    volumes:
      - ./elicit-brand/:/opt/brand:ro
      - ./elicit-i18n/:/opt/i18n:ro
      # - ../Elicit_Campsites/um-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
      author-survey:
        condition: service_healthy
# Test containers
# These containers are used for running the application in a development environment.
# They are not needed for production or will be replaced by non containerized applications.
## Postgres Database
  db:
    # Not on ELICIT_TAG: the database image has its own release cadence (see the header).
    image: elicitsoftware/elicit_db:latest
    # Setup the directories to persist data between starts.
    # if you need to reset your database you can delete the PGDATA directory and restart the containers
    # this will cause the database to be recreated.
    volumes:
      - ./postgresql/PGDATA:/var/lib/postgresql/data
      # Adds the `author` database (Author stack) on first initialization.
      - ./db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql:/docker-entrypoint-initdb.d/V0.0.4__CREATE_AUTHOR_DATABASE.sql:ro
    ports:
      - 5452:5432
    environment:
      TZ: "America/Detroit"    
      POSTGRES_USER: "survey"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey && psql -U survey -d survey -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
# OIDC Server
# This is a Keycloak server that is used for testing the OIDC integration.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    command: start-dev --import-realm --verbose -Dkeycloak.features=scripts
    ports:
      - "8180:8080"
    environment:
      TZ: "America/Detroit"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/db:/h2  
# SMTP Server
# This is a Mailpit server that is used for testing the email integration.    
# visit http://localhost:8025/ to view the emails sent by the application.
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    volumes:
      - ./mailpit_data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      TZ: "America/Detroit"
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
# SFTP Server
# This is a SFTP server that is used for testing the SFTP integration.      
  sftpServer:
    image: atmoz/sftp:alpine
    ports:
      - "22:22"
    environment:
      TZ: "America/Detroit"
      SFTP_USERS: fhhs_user:pass:::upload/reports
    volumes:
      - ./sftp_data/temp/upload/reports:/home/fhhs_user/upload/reports
      - ./sftp_ssh/fhhs_user.pub:/home/fhhs_user/.ssh/authorized_keys:ro
# OpenTelemetry Tracing
# Jaeger - Distributed tracing UI and backend
# Visit http://localhost:16686 to view traces
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger gRPC
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      TZ: "America/Detroit"
      COLLECTOR_OTLP_ENABLED: "true"
      