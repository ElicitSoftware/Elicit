importDefinitionView.intro=ارفع ملف ELICIT_SURVEY_EXPORT_V1 (‎.elicit) لفتحه في Author كنسخة عمل. يُحتفظ بكل مفتاح استبيان وعنصر في الملف كما هو تمامًا، بحيث يحدّث التصدير اللاحق الصفوف نفسها في كل موقع طبّقه سابقًا. يُرفض الاستبيان الذي يكون مفتاحه مفتوحًا هنا بالفعل.
importDefinitionView.introDraft=يُقبل أيضًا ملف ELICIT_SURVEY_DRAFT_V1: تعريف تم إعداده خارج Author، ويترك مفاتيحه فارغة ليولّدها Author. لا يقرأ هذا العلامة سوى Author، لذا لا يمكن تركيب المسودة في أي موقع قبل أن تجتاز التحقق هنا ويتم تصديرها.
importDefinitionView.aiDraftLink=ليس لديك مسودة بعد؟ اطلب من وكيل ذكاء اصطناعي كتابتها
