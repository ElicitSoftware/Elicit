aiDraftView.pageTitle=مسودة بالذكاء الاصطناعي
aiDraftView.title=إعداد مسودة استبيان بمساعدة وكيل ذكاء اصطناعي
aiDraftView.intro=يمكن أن يبدأ الاستبيان من مسودة كُتبت في مكان آخر. خذ المواصفة إلى أي جلسة ذكاء اصطناعي، وصِف الاستبيان الذي تريده، ثم أعد الملف الذي يكتبه. لا يخرج شيء من هذا التثبيت من تلقاء نفسه: أنت من يحمل المواصفة إلى الخارج، وأنت من يعيد المسودة.
aiDraftView.step1=انسخ التعليمات إلى جلسة ذكاء اصطناعي، أو نزّل المواصفة وأرفق الملف.
aiDraftView.step2=صِف الاستبيان الذي تريده. سيسألك الوكيل عن كل ما يحدد البنية: الموضوعات التي تغطيها، وما يتكرر لكل شخص أو عنصر، وما يجب أن يكون شرطيًا.
aiDraftView.step3=احفظ ملف ‎.elicit‎ الذي يكتبه الوكيل.
aiDraftView.step4=استورده هنا. يولّد Author كل المفاتيح عند الاستيراد، فتصل المسودة كنسخة عمل عادية.
aiDraftView.copy=نسخ التعليمات إلى الحافظة
aiDraftView.download=تنزيل المواصفة
aiDraftView.copied=تم نسخ التعليمات. الصقها في جلسة الذكاء الاصطناعي.
aiDraftView.copyFailed=تعذّر النسخ إلى الحافظة. نزّل المواصفة بدلًا من ذلك.
aiDraftView.unavailable=هذه النسخة لا تتضمن المواصفة، فليس هناك ما يمكن نسخه أو تنزيله.
aiDraftView.whatComesBack.h=ما الذي يعود إليك
aiDraftView.whatComesBack.p1=المسودة ليست تعريفًا قابلًا للنشر. تحمل علامة لا يقرأها سوى Author، فلا يمكن تركيبها في أي موقع قبل أن تراجعها هنا وتصدّرها.
aiDraftView.whatComesBack.p2=توقّع أن تصحّح بعض الأمور. افتح الاستبيان المستورد، واقرأ لوحة التحقق وصحّح ما تشير إليه، أو أعد تلك الرسائل إلى الوكيل واستورد مسودة مصحّحة.
aiDraftView.goToImport=الانتقال إلى استيراد تعريف
aiDraftView.promptPreamble=أريد كتابة تعريف استبيان لمنصة الاستبيانات Elicit. تشرح لك المواصفة أدناه نموذج الاستبيان وصيغة الملف بالضبط. اقرأها، واسألني عمّا تحتاج معرفته عن الاستبيان الذي أريده، ثم اكتب لي ملف مسودة ‎.elicit‎ كاملًا.
guideView.pageTitle=كيف يُبنى الاستبيان
guideView.title=كيف يُبنى الاستبيان
guideView.diagram.alt=لوحة المصمم لاستبيان صغير باسم Family history: بطاقتا خطوة، About you وEach child، تحتوي كل منهما على بطاقات أقسام (You وChildren، ثم Child) وصفوف أسئلة داخلها، وقاعدة إظهار مرسومة من السؤال 'Has children' إلى السؤال 'Child count'.
guideView.surveysLink=الانتقال إلى قائمة الاستبيانات
guideView.intro.p1=استبيان Elicit هو شجرة قرارات يسير فيها المستجيب. تعرض هذه الصفحة الأجزاء التي يتكوّن منها الاستبيان وكيف يرسمها المصمم، بالأسماء والرموز نفسها التي ستراها على اللوحة وفي شجرة البنية.
guideView.tree.h=Elicit شجرة قرارات
guideView.tree.p1=ينتقل المستجيب عبر الاستبيان صفحة واحدة في كل مرة. وما يجيب به يحدد ما يراه بعد ذلك: يمكن لسؤال أن يفتح قسمًا، أو يكرر مجموعة أسئلة، أو يغيّر صياغة سؤال لاحق. تصميم الاستبيان يعني تصميم ذلك المسار.
guideView.containers.h=الحاويات متداخلة
guideView.containers.p1=كل شيء يقع داخل شيء آخر. الاستبيان يحتوي على خطوات، والخطوة تحتوي على أقسام، والقسم يحتوي على أسئلة.
guideView.containers.step.term=الخطوة
guideView.containers.step.desc=— صفحة في شريط تقدم المستجيب. بالنسبة لك هي مسار على اللوحة يجمع الأقسام المترابطة.
guideView.containers.section.term=القسم
guideView.containers.section.desc=— مجموعة أسئلة بعنوان في تلك الصفحة. بالنسبة لك هي بطاقة داخل مسار.
guideView.containers.question.term=السؤال
guideView.containers.question.desc=— مدخل واحد يجيب عنه المستجيب. بالنسبة لك هو صف داخل بطاقة، مع رمز يبيّن نوعه.
guideView.order.h=الترتيب هو المسار الافتراضي
guideView.order.p1=تُنفَّذ الخطوات بالترتيب، والأقسام بالترتيب داخل خطوتها، والأسئلة بالترتيب داخل قسمها. وما لم تنص قاعدة على خلاف ذلك، فإن ترتيب العرض هذا هو بالضبط ما يختبره المستجيب. سحب عنصر إلى موضع جديد يغيّره.
guideView.order.p2=لا تُبنى عند تسجيل دخول المستجيب إلا الخطوة الأولى. أما كل خطوة وقسم وسؤال بعدها فيُبنى في الوقت المناسب، بقاعدة إظهار أو تكرار، حين تستدعيه إجابات المستجيب — فتظهر الصفحة الأولى بسرعة، ومن يغادر في الخطوة الأولى أو الثانية لا يترك شيئًا محفوظًا لأسئلة لم يرها قط. امنح كل عنصر لاحق قاعدة كهذه؛ وللخطوة التي تأتي دائمًا، فالمعتادة هي الحقل موجود ← إظهار على الخطوة، مقروءة من سؤال تجاوزه المستجيب بالفعل. يُبلغ التحقق عن أي عنصر لاحق لا تبنيه قاعدة.
guideView.rules.h=القواعد هي الأسهم
guideView.rules.p1=تقرأ القاعدة الإجابة عن سؤال سابق، وتقارنها بقيمة مرجعية باستخدام عامل، وعندما تتحقق المقارنة تنفّذ إجراءً على هدف لاحق: خطوة أو قسم أو سؤال. وعند كتابتها، كل قاعدة هي الجملة نفسها:
guideView.rules.example.question=كم عدد أطفالك؟
guideView.rules.example.action=تكرار
guideView.rules.example.section=طفل
guideView.rules.example.thatManyTimes=بهذا العدد من المرات
guideView.rules.example.ariaLabel=قاعدة مثال: السؤال 'كم عدد أطفالك؟' أكبر من 0 يكرر القسم 'طفل' بهذا العدد من المرات
guideView.rules.show.term=إظهار
guideView.rules.show.desc=— يظهر الهدف فقط عندما تتحقق القاعدة. وحتى ذلك الحين لا يراه المستجيب أبدًا.
guideView.rules.repeat.term=تكرار
guideView.rules.repeat.desc=— يُكرَّر القسم أو السؤال الهدف بعدد المرات الذي تحدده الإجابة، مثلًا قسم 'طفل' واحد لكل طفل. وعندما تكون الإجابة تحديدًا من قائمة، يُكرَّر الهدف مرة لكل عنصر محدد ويُملأ رمز القاعدة بنص ذلك العنصر، مثلًا قسم 'مباراة' واحد لكل مباراة حُضرت.
guideView.rules.text.term=نص
guideView.rules.text.desc=— تُكتب الإجابة في نص الهدف حيثما يظهر عنصر نائب {<TOKEN>|default}، بحيث يمكن لسؤال لاحق أن يقول 'ابنتك' بدلًا من 'طفلك'. تصل القاعدة إلى كل ما داخل هدفها: قاعدة نص واحدة على خطوة تملأ العنصر النائب في كل قسم وسؤال في تلك الخطوة. العنصر النائب هو اسم لموضع، لا سؤال — ويمكن لعدة قواعد أن تملأ العنصر النائب نفسه، كل منها حيث يُستخدم.
guideView.rules.p2=لا توجد قاعدة إخفاء. الإخفاء هو نفسه عدم الإظهار: أعطِ العنصر قاعدة إظهار فيبقى مخفيًا حتى تتحقق تلك القاعدة.
guideView.rules.p3=العوامل هي: منطقي، أكبر من، يساوي، لا يساوي، الحقل موجود، ويحتوي على. وعندما تشير عدة قواعد إلى الهدف نفسه، يجب أن تتحقق جميعها.
guideView.designer.h=المصمم يرسم كل هذا
guideView.designer.p1=على اللوحة، المسارات هي الخطوات، والبطاقات هي الأقسام، والصفوف هي الأسئلة، والأسهم هي القواعد. تبدأ البطاقة مغلقة؛ نقرة واحدة تفتحها وتحددها، والنقر المزدوج على مسار أو بطاقة أو صف يفتح محرره، وقائمة ⋮ على كل عنصر تسرد كل ما يمكنك فعله به. يعرض مسار التنقل في أعلى الصفحة موضعك (الاستبيان، الخطوة، القسم، السؤال)، وتتبع شجرة البنية في أسفل الدرج تحديدك. يحمل كل عنصر رمزه، والرمز هو مقبضه: اسحب رمزًا من لوحة عناصر التحكم لإنشاء عنصر، أو اسحبه داخل حاويته لإعادة الترتيب، أو اسحبه إلى حاوية أخرى لإظهار العنصر نفسه هناك أيضًا (قسم في خطوة أخرى، سؤال في قسم آخر)؛ أما نسخ إلى الخطوة… في قائمة البطاقة فينشئ قسمًا منفصلًا بدلًا من ذلك. اسحب رمز قاعدة على سؤال لبدء قاعدة، ثم اسحب رأس السهم إلى الهدف. كل ما يمكن فعله بالسحب يمكن فعله من قائمة العنصر أيضًا.
guideView.designing.h=تصميم استبيان
guideView.designing.p1=افتح استبيانًا من قائمة الاستبيانات واختر تصميم…. الدرج على اليسار هو صندوق أدواتك؛ واللوحة على اليمين هي الاستبيان. اعمل من الأعلى إلى الأسفل: الخطوات، ثم الأقسام، ثم الأسئلة، ثم القوائم والقواعد ووسوم التحليل التي تمنحها معناها.
guideView.designing.search.term=بحث
guideView.designing.search.desc=— لكل من لوحات القوائم والأقسام والأسئلة مربع بحث خاص يضيّق تلك اللوحة أثناء الكتابة: القوائم بالاسم والوصف ونص الخيارات، والأقسام بالاسم والوصف، والأسئلة بالاسم والنص والنوع. مفيد عندما يحتوي الاستبيان على العشرات من كل منها.
guideView.designing.controls.term=عناصر التحكم
guideView.designing.controls.desc=— رموز الخطوة والقسم والسؤال من النوع المختار والقواعد الثلاث. اسحب أحدها إلى اللوحة، أو استخدم إضافة خطوة وعناصر إضافة… في القوائم.
guideView.designing.lists.term=القوائم
guideView.designing.lists.desc=— قوائم الخيارات التي يقدمها سؤال الاختيار (زر اختيار، مربع تحرير وسرد، اختيار متعدد، مجموعة مربعات اختيار). قائمة جديدة… تعرّف قائمة بخياراتها بالترتيب؛ اسحب رمز قائمة على سؤال لمنحه تلك الخيارات، أو اختر القائمة في محرر السؤال.
guideView.designing.sections.term=الأقسام
guideView.designing.sections.desc=— كل قسم في الاستبيان، مرة واحدة، مع عدد الخطوات التي رُكّب فيها. اسحب قسمًا إلى مسار، أو استخدم تركيب في الخطوة…، لإظهار القسم نفسه في خطوة أخرى؛ يبقى قسمًا واحدًا، فأي تغيير في اسمه أو أسئلته يصل إلى كل خطوة.
guideView.designing.questions.term=الأسئلة
guideView.designing.questions.desc=— كل سؤال في الاستبيان، مرة واحدة، مع عدد الأقسام التي يظهر فيها. اسحب سؤالًا إلى بطاقة، أو استخدم إضافة إلى القسم…، لطرح السؤال نفسه في مكان آخر؛ يبقى سؤالًا واحدًا، فأي تغيير في نصه يصل إلى كل قسم يوجد فيه.
guideView.designing.reportingTags.term=وسوم التحليل
guideView.designing.reportingTags.desc=— تقدم قائمة ⋮ لسؤال أو قسم وسوم التحليل…؛ وتسرد صفحة التحليل… للاستبيان جميعها مع الجداول والأعمدة التي تنتجها. تعرض العناصر الموسومة شارة وسم على اللوحة، إدخالًا واحدًا لكل وسم.
guideView.designing.structure.term=بنية الاستبيان
guideView.designing.structure.desc=— الشجرة في أسفل الدرج؛ انقر على عنصر لتحديده على اللوحة. إظهار المحذوفة يكشف العناصر المتقاعدة حتى يمكن استعادتها.
guideView.designing.p2=عندما تكتمل البنية، أضف قواعد لكل ما هو مشروط، وسِم ما يحتاجه مخطط التحليل في الموقع، وعلّم ما تعرضه التقارير، وراجع لوحة التحقق في نظرة عامة على الاستبيان، وصدّر… ملف ‎.elicit ليثبّته تطبيق Admin.
guideView.reportingTags.h=وسوم التحليل
guideView.reportingTags.p1=يسمّي وسم التحليل عمودًا في مخطط النجمة الذي يبنيه الموقع من الإجابات لأغراض التحليل. وسِم سؤالًا فتملأ إجاباته ذلك العمود؛ ووسِم قسمًا كما يظهر في خطوة بقيمة ثابتة، فيُصنَّف كل مستجيب يصل إليه بتلك القيمة. تتشارك الوسوم التي تتشارك بُعدًا جدول قيم واحدًا. افتح صفحة التحليل للاستبيان، أو عنصر 'وسوم التحليل…' على سؤال أو قسم، لإدارتها. تغيير وسم معيّن أو إزالته له أثر رجعي: تُعاد تصنيف الإجابات المسجلة بالفعل في المواقع المنشورة. الوسوم ليست تقارير: ما يقرؤه المستجيب أو المسؤول تحدده علامات التقرير في صفحة التقارير للاستبيان.
guideView.identity.h=الهوية والتصدير
guideView.identity.p1=يحصل كل عنصر على مفتاح لحظة إنشائه ويحتفظ به مدى الحياة. إزالة عنصر تُقاعده بدلًا من حذفه، فتحتفظ الإجابات المسجلة بالفعل في موقع ما بمعناها. عندما يصبح الاستبيان جاهزًا تصدّر ملف ‎.elicit؛ يثبّته تطبيق Admin في الموقع في المرة الأولى ثم يحدّثه في مكانه بعد ذلك، بمطابقة العناصر حسب المفتاح.
guideView.identity.p2=حذف استبيان كامل، من قائمة الاستبيانات، هو الشيء الوحيد الذي يزيل الصفوف فعلًا، ولا يمكن التراجع عنه. نزّل النسخة الاحتياطية المعروضة أولًا: استيراد ذلك الملف يعيد الاستبيان بكل مفاتيحه. لا تتأثر المواقع التي طبّقت تصديرًا؛ لتغييرها لاحقًا، استورد النسخة الاحتياطية وعدّلها ثم صدّر مرة أخرى.
