importDefinitionView.draftNotice=جاء هذا من مسودة {0}، لذا تم توليد مفاتيحه هنا. راجعه وصحّح كل ما يشير إليه التحقق، ثم صدّره للحصول على ملف يمكن لأي موقع تطبيقه.
