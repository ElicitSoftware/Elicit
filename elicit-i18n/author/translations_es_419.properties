validation.order.questions=Dos preguntas de esta sección comparten la posición {0}. Reordénelas.
validation.rule.noTarget={0} no tiene destino posterior. Elija el paso, la sección o la pregunta sobre la que actúa.
validation.rule.sectionNotInStep={0} tiene como destino posterior la sección ''{1}'' del paso ''{2}'', pero esa sección no está en ese paso. Elija de nuevo el destino posterior.
validation.rule.questionNotInSection={0} tiene como destino posterior la pregunta ''{1}'' de la sección ''{2}'', pero esa pregunta no está en esa sección. Elija de nuevo el destino posterior.
validation.rule.questionWithoutPlace={0} tiene como destino posterior la pregunta ''{1}'', en una sección distinta de la de su pregunta de origen, pero no indica en qué paso y sección. Elija de nuevo el destino posterior.
validation.rule.readsRemovedQuestion={0} tiene una pregunta de origen que se eliminó. Elija otra pregunta de origen.
validation.rule.readsRemovedStep={0} tiene un paso de origen que se eliminó. Elija de nuevo la pregunta de origen.
validation.rule.targetsRemovedStep={0} tiene como destino posterior un paso que se eliminó. Elija otro destino posterior.
validation.rule.targetsRemovedSection={0} tiene como destino posterior una sección que ya no está en ese paso. Elija otro destino posterior.
validation.rule.targetsRemovedQuestion={0} tiene como destino posterior una pregunta que ya no está en esa sección. Elija otro destino posterior.
validation.rule.incomplete={0} está incompleta. Elija su operador y su acción.
validation.rule.repeatSelectionOperator={0} repite su destino posterior una vez por cada elemento seleccionado en su pregunta de origen, pero su operador, {1}, nunca se cumple para una selección, así que nunca se repetiría nada. Cambie el operador a "El campo existe".
validation.rule.backwards={0} apunta hacia atrás: {1}.
validation.rule.backwards.question=el destino posterior, la pregunta ''{0}'' del paso ''{1}'' › ''{2}'', debe ir después de la pregunta de origen ''{3}'' del paso ''{4}'' › ''{5}''
validation.rule.backwards.section=el destino posterior, la sección ''{0}'' del paso ''{1}'', debe ir después de la pregunta de origen ''{2}'' del paso ''{3}'' › ''{4}''
validation.rule.backwards.step=el destino posterior, el paso ''{0}'', debe ir después de la pregunta de origen ''{1}'' del paso ''{2}'' › ''{3}''
validation.rule.backwards.edge=Apunta hacia atrás: {0}
validation.step.noBuildingRule=El paso ''{0}'' no tiene una regla Mostrar o Repetir. Todo paso posterior al primero necesita una. Agregue una regla Mostrar en el paso; normalmente "El campo existe" sobre una pregunta de origen.
validation.section.noBuildingRule=La sección ''{0}'' del paso ''{1}'' no tiene una regla Mostrar o Repetir. Todo lo que viene después del primer paso necesita una. Agregue una regla Mostrar en la sección de este paso; normalmente "El campo existe" sobre una pregunta de origen.
validation.question.noBuildingRule=La pregunta ''{0}'' de la sección ''{1}'' del paso ''{2}'' no tiene una regla Mostrar o Repetir. Todo lo que viene después del primer paso necesita una. Agregue una regla Mostrar en la pregunta, en su sección o en su paso; normalmente "El campo existe" sobre una pregunta de origen.
validation.token.unfilledWithDefault={0} usa {1}, pero ninguna regla lo completa aquí. Los encuestados siempre verán "{2}".
validation.token.unfilledNoDefault={0} usa {1}, pero ninguna regla lo completa aquí y no tiene valor predeterminado, así que los encuestados verían {1} tal cual. Agregue una regla que lo complete o dele un valor predeterminado: {2}.
validation.token.undelimited={0} usa {1} sin corchetes angulares alrededor del token. Escriba {2}.
validation.token.undelimitedWithDefault={0} usa {1} sin corchetes angulares alrededor del token. Escriba {2}. Hasta entonces, los encuestados siempre verán "{3}".
validation.token.undefined={0} usa {1} en {2}, pero ninguna regla tiene un token llamado {3}, así que los encuestados siempre verán "{5}". Agregue el token a una regla. Si {1} es formato, muévalo fuera de las llaves: {4}
validation.token.undefinedNoDefault={0} usa {1} en {2}, pero ninguna regla tiene un token llamado {3}, así que los encuestados siempre verán el texto tal como está escrito. Agregue el token a una regla. Si {1} es formato, muévalo fuera de las llaves: {4}
validation.rule.tokenUnused={0} tiene el token {1}, pero nada en su destino posterior usa {2}. Agréguelo a un texto de allí o quite el token de la regla.
validation.rule.displayOnlyNoValue={0} no puede completar {1}: su pregunta de origen ''{2}'' solo muestra texto ({3}) y no tiene respuesta. Elija una pregunta de origen que el encuestado responda o defina "{4}" en la regla.
validation.rule.displayOnlyConstant={0} tiene como pregunta de origen ''{2}'', que solo muestra texto ({3}) y no tiene respuesta, así que {1} siempre es el "{4}" de la regla. Para usar una respuesta real, elija una pregunta de origen que el encuestado responda.
validation.rule.tokenBracketed={0} tiene el token {1}. Escríbalo sin corchetes angulares: {2}. Los corchetes solo van en el texto, como {3}.
validation.rule.tokenInvalid={0} tiene el token "{1}", que no es un nombre válido. Use solo letras, dígitos y guiones bajos.
validation.rule.tokenLeadingDigit={0} tiene el token {1}. Funciona, pero el nombre de un token debería empezar con una letra. Cámbiele el nombre.
validation.rule.tokenCase={0} tiene el token {1}. Funciona, pero escriba {2} para que la lista de tokens no muestre ambos.
validation.rename.step=El paso ''{0}'' cambió de nombre a ''{1}''. Los sitios que ya usan esta encuesta mostrarán el nuevo nombre también en los datos ya registrados.
validation.rename.section=La sección ''{0}'' cambió de nombre a ''{1}''. Los sitios que ya usan esta encuesta mostrarán el nuevo nombre también en los datos ya registrados.
validation.tag.redefined=La etiqueta {0} se cambió a {1}. Las respuestas ya recopiladas en los sitios que usan esta encuesta se registrarán con la nueva etiqueta.
validation.tag.reassigned={0}: la etiqueta {1} se cambió a {2}. Las respuestas ya recopiladas en los sitios que usan esta encuesta se registrarán con la nueva etiqueta.
validation.tag.unassigned={0}: se quitó la etiqueta {1}. Las respuestas ya recopiladas en los sitios que usan esta encuesta dejarán de registrarse con ella.
validation.tag.assignmentBroken=La etiqueta ''{0}'' está asignada, pero no a una sola sección o pregunta. Quite la asignación y agréguela de nuevo.
validation.tag.assignedToRemoved.section=La etiqueta ''{0}'' está asignada a una sección que se eliminó{1}. Quite la asignación.
validation.tag.assignedToRemoved.question=La etiqueta ''{0}'' está asignada a una pregunta que se eliminó{1}. Quite la asignación.
validation.tag.assignedTwice=La etiqueta ''{0}'' está asignada a {1} {2} veces con valores distintos. Conserve una.
validation.tag.table.empty=La etiqueta ''{0}'' da a la tabla de dimensión un nombre vacío. Cambie el nombre de la etiqueta o de su dimensión; los sitios no podrían construir su esquema de análisis con este nombre.
validation.tag.table.characters=La etiqueta ''{0}'' da a la tabla de dimensión el nombre ''{1}'', que solo puede usar a–z, 0–9 y _. Cambie el nombre de la etiqueta o de su dimensión; los sitios no podrían construir su esquema de análisis con este nombre.
validation.tag.table.tooLong=La etiqueta ''{0}'' da a la tabla de dimensión el nombre ''{1}'', que tiene más de {2} caracteres. Cambie el nombre de la etiqueta o de su dimensión; los sitios no podrían construir su esquema de análisis con este nombre.
validation.tag.column.empty=La etiqueta ''{0}'' da a la columna un nombre vacío. Cambie el nombre de la etiqueta; los sitios no podrían construir su esquema de análisis con este nombre.
validation.tag.column.characters=La etiqueta ''{0}'' da a la columna el nombre ''{1}'', que solo puede usar a–z, 0–9 y _. Cambie el nombre de la etiqueta; los sitios no podrían construir su esquema de análisis con este nombre.
validation.tag.column.tooLong=La etiqueta ''{0}'' da a la columna el nombre ''{1}'', que tiene más de {2} caracteres. Cambie el nombre de la etiqueta; los sitios no podrían construir su esquema de análisis con este nombre.
validation.tag.column.reserved=La etiqueta ''{0}'' da a la columna el nombre ''{1}'', que es una columna fija de la tabla de hechos de toda encuesta (step_key, section_key, question_key, item_key). Cambie el nombre de la etiqueta; la construcción del esquema de análisis del sitio la rechaza.
validation.tag.unused=La etiqueta ''{0}'' no se usa. Asígnela a una sección o pregunta, o elimínela.
validation.tag.sameColumn=Las etiquetas {0} producen la misma columna, ''{1}''. Cambie el nombre de una de ellas.
validation.tag.tableClash=La etiqueta ''{0}'' no tiene dimensión, así que su tabla de informes es ''{1}'', la misma que usa la dimensión ''{2}''. Cambie el nombre de la etiqueta o asígnele una dimensión.
validation.translation.missing.one={0}: 1 texto aún no está traducido. Los encuestados lo verán en el idioma propio de la encuesta.
