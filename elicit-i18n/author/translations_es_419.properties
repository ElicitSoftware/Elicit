guideView.pageTitle=Cómo se compone una encuesta
guideView.title=Cómo se compone una encuesta
guideView.diagram.alt=El tablero del diseñador para una encuesta pequeña llamada Family history: dos tarjetas de paso, About you y Each child, cada una con tarjetas de sección (You y Children, luego Child) y filas de preguntas dentro, y una regla Mostrar trazada desde la pregunta 'Has children' hasta la pregunta 'Child count'.
guideView.surveysLink=Ir a la lista de encuestas
guideView.intro.p1=Una encuesta de Elicit es un árbol de decisiones que el encuestado recorre. Esta página muestra las piezas que componen una encuesta y cómo las dibuja el diseñador, con los mismos nombres y glifos que verá en el tablero y en el árbol de estructura.
guideView.tree.h=Elicit es un árbol de decisiones
guideView.tree.p1=El encuestado avanza por la encuesta una página a la vez. Lo que responde decide lo que ve a continuación: una pregunta puede abrir una sección, repetir un grupo de preguntas o cambiar la redacción de una pregunta posterior. Diseñar una encuesta significa diseñar ese recorrido.
guideView.containers.h=Los contenedores se anidan
guideView.containers.p1=Todo está dentro de algo más. Una encuesta contiene pasos, un paso contiene secciones y una sección contiene preguntas.
guideView.containers.step.term=Paso
guideView.containers.step.desc=— una página en la barra de progreso del encuestado. Para usted es un carril en el tablero que agrupa secciones relacionadas.
guideView.containers.section.term=Sección
guideView.containers.section.desc=— un grupo de preguntas con título en esa página. Para usted es una tarjeta dentro de un carril.
guideView.containers.question.term=Pregunta
guideView.containers.question.desc=— una entrada que el encuestado responde. Para usted es una fila dentro de una tarjeta, con un glifo que indica su tipo.
guideView.order.h=El orden es el recorrido predeterminado
guideView.order.p1=Los pasos se ejecutan en orden, las secciones en orden dentro de su paso y las preguntas en orden dentro de su sección. A menos que una regla indique lo contrario, ese orden de visualización es exactamente lo que experimenta el encuestado. Arrastrar un elemento a una nueva posición lo cambia.
guideView.rules.h=Las reglas son las flechas
guideView.rules.p1=Una regla lee la respuesta a una pregunta anterior, la compara con un valor de referencia mediante un operador y, cuando la comparación se cumple, realiza una acción sobre un destino posterior: un paso, una sección o una pregunta. Escrita, toda regla es la misma oración:
guideView.rules.example.question=¿Cuántos hijos tiene?
guideView.rules.example.action=Repetir
guideView.rules.example.section=Hijo
guideView.rules.example.thatManyTimes=esa cantidad de veces
guideView.rules.example.ariaLabel=Regla de ejemplo: la pregunta '¿Cuántos hijos tiene?' mayor que 0 repite la sección 'Hijo' esa cantidad de veces
guideView.rules.show.term=Mostrar
guideView.rules.show.desc=— el destino aparece solo cuando la regla se cumple. Hasta entonces el encuestado nunca lo ve.
guideView.rules.repeat.term=Repetir
guideView.rules.repeat.desc=— la sección o pregunta de destino se repite tantas veces como indique la respuesta, por ejemplo una sección 'Hijo' por cada hijo.
guideView.rules.text.term=Texto
guideView.rules.text.desc=— la respuesta se escribe en el texto del destino dondequiera que aparezca un marcador {TOKEN|default}, de modo que una pregunta posterior pueda decir 'su hija' en lugar de 'su hijo'. La regla alcanza todo lo que hay dentro de su destino: una regla de Texto en un paso rellena el marcador en cada sección y pregunta de ese paso. Un marcador es el nombre de un espacio, no una pregunta — varias reglas pueden rellenar el mismo marcador, cada una donde se usa.
guideView.rules.p2=No existe una regla Ocultar. Ocultar es lo mismo que no mostrar: asigne al elemento una regla Mostrar y permanecerá oculto hasta que esa regla se cumpla.
guideView.rules.p3=Los operadores son Booleano, Mayor que, Igual, Distinto, El campo existe y Contiene. Cuando varias reglas apuntan al mismo destino, todas deben cumplirse.
guideView.designer.h=El diseñador dibuja todo esto
guideView.designer.p1=En el tablero, los carriles son pasos, las tarjetas son secciones, las filas son preguntas y las flechas son reglas. Una tarjeta empieza cerrada; un clic la abre y la selecciona, un doble clic en un carril, tarjeta o fila abre su editor, y el menú ⋮ de cada elemento enumera todo lo que puede hacer con él. Una ruta de navegación en la parte superior de la página muestra dónde está (encuesta, paso, sección, pregunta), y el árbol de estructura en la parte inferior del panel sigue su selección. Cada elemento lleva su glifo, y el glifo es su asa: arrastre un glifo desde el panel Controles para crear un elemento, arrástrelo dentro de su contenedor para reordenar, o arrástrelo a otro contenedor para mostrar el mismo elemento también allí (una sección en otro paso, una pregunta en otra sección); Copiar al paso… en el menú de una tarjeta crea en cambio una sección separada. Arrastre un glifo de regla sobre una pregunta para iniciar una regla y luego arrastre la punta de la flecha sobre el destino. Todo lo que puede hacer un arrastre también lo puede hacer el menú del elemento.
guideView.designing.h=Diseñar una encuesta
guideView.designing.p1=Abra una encuesta desde la lista de encuestas y elija Diseñar…. El panel de la izquierda es su caja de herramientas; el tablero de la derecha es la encuesta. Trabaje de arriba hacia abajo: pasos, luego secciones, luego preguntas y después las listas, reglas y etiquetas de informes que les dan significado.
guideView.designing.search.term=Buscar
guideView.designing.search.desc=— cada uno de los paneles Listas, Secciones y Preguntas tiene su propio cuadro de búsqueda que filtra ese panel mientras escribe: las listas por nombre, descripción y texto de las opciones, las secciones por nombre y descripción, las preguntas por nombre, texto y tipo. Útil cuando una encuesta tiene decenas de cada uno.
guideView.designing.controls.term=Controles
guideView.designing.controls.desc=— los glifos de un paso, una sección, una pregunta del tipo elegido y las tres reglas. Arrastre uno al tablero, o use Agregar paso y los elementos Agregar… de los menús.
guideView.designing.lists.term=Listas
guideView.designing.lists.desc=— las listas de opciones que ofrece una pregunta de elección (radio, cuadro combinado, selección múltiple, grupo de casillas). Nueva lista… define una con sus opciones en orden; arrastre el glifo de una lista sobre una pregunta para darle esas opciones, o elija la lista en el editor de la pregunta.
guideView.designing.sections.term=Secciones
guideView.designing.sections.desc=— cada sección de la encuesta, una sola vez, con el número de pasos en los que está montada. Arrastre una a un carril, o use Montar en el paso…, para mostrar la misma sección en otro paso; sigue siendo una sola sección, así que un cambio en su nombre o sus preguntas llega a todos los pasos.
guideView.designing.questions.term=Preguntas
guideView.designing.questions.desc=— cada pregunta de la encuesta, una sola vez, con el número de secciones en las que aparece. Arrastre una a una tarjeta, o use Agregar a la sección…, para hacer la misma pregunta en otro lugar; sigue siendo una sola pregunta, así que un cambio en su texto llega a todas las secciones en las que está.
guideView.designing.reportingTags.term=Etiquetas de informes
guideView.designing.reportingTags.desc=— el menú ⋮ de una pregunta o sección ofrece Etiquetas de informes…; la página Informes… de la encuesta las enumera todas con las tablas y columnas que producen. Los elementos etiquetados muestran una insignia de etiqueta en el tablero, una entrada por etiqueta.
guideView.designing.structure.term=Estructura de la encuesta
guideView.designing.structure.desc=— el árbol en la parte inferior del panel; haga clic en un elemento para seleccionarlo en el tablero. Mostrar eliminados revela los elementos retirados para que puedan restaurarse.
guideView.designing.p2=Cuando la estructura esté lista, agregue reglas para todo lo condicional, etiquete lo que necesite el informe, revise el panel de validación en el resumen de la encuesta y Exporte… el archivo .elicit para que lo instale la aplicación Admin.
guideView.reportingTags.h=Etiquetas de informes
guideView.reportingTags.p1=Una etiqueta de informes nombra una columna del informe que un sitio construye a partir de las respuestas. Etiquete una pregunta y sus respuestas llenan esa columna; etiquete una sección tal como aparece en un paso con un valor fijo, y cada encuestado que llegue a ella queda clasificado por ese valor. Las etiquetas que comparten una dimensión comparten una tabla de valores. Abra la página Informes de una encuesta, o el elemento 'Etiquetas de informes…' de una pregunta o sección, para administrarlas. Cambiar o quitar una etiqueta asignada es retroactivo: las respuestas ya registradas en los sitios desplegados se reclasifican.
guideView.identity.h=Identidad y exportación
guideView.identity.p1=Cada elemento recibe una clave en el momento en que se crea y la conserva de por vida. Eliminar un elemento lo retira en lugar de borrarlo, de modo que las respuestas ya registradas en un sitio conservan su significado. Cuando la encuesta está lista, usted exporta un archivo .elicit; la aplicación Admin lo instala en un sitio la primera vez y después lo actualiza en su lugar, emparejando los elementos por clave.
