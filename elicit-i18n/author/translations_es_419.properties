importDefinitionView.intro=Cargue un archivo ELICIT_SURVEY_EXPORT_V1 (.elicit) para abrirlo en Author como copia de trabajo. Cada clave de encuesta y de elemento del archivo se conserva exactamente igual, de modo que una exportación posterior actualiza las mismas filas en cada sitio que ya la aplicó. Se rechaza una encuesta cuya clave ya esté abierta aquí.
importDefinitionView.introDraft=También se acepta un archivo ELICIT_SURVEY_DRAFT_V1: una definición redactada fuera de Author, que deja sus claves en blanco para que Author las genere. Solo Author lee ese marcador, así que un borrador no puede instalarse en un sitio hasta que pase la validación aquí y se exporte.
