# Site 1 - the master site of the multi-site e2e test (see ../README.md).
#
# A self-contained copy of ../../docker-compose.yml (the umbrella's stack) on the stock host
# ports, with its own
# compose project name and its own data directories under ../data/site1 so the test never
# touches the developer's database volume. It cannot run at the same time as the
# umbrella's stack (same ports). Differences from the umbrella's file:
#   - no published ports for SMTP (1025) or the Jaeger collector (4317/4318):
#     the apps reach mailpit and jaeger by service name
#   - no fhhs and no sftpServer: FHHS serves only the Family History Survey and this journey runs
#     the Household Survey, so it would never become ready (FHHS UC-005); nothing else used SFTP
# Keycloak and Mailpit here are shared with site 2 (see ../site2/docker-compose.yml).
# Every Elicit image runs at one tag, ELICIT_TAG, as in ../../docker-compose.yml. Here it defaults
# to `latest`, the local builds (../../buildDockerImages.sh, elicit_db included): the suite tests
# what was just built. ELICIT_TAG=<release> runs it against a published release instead.
name: elicit-site1

services:
  survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-latest}
    ports:
      - 8080:8080
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: elicit-e2e-service-token-multisite-site1
      TZ: America/Detroit
      accessCode.autoRegister: true
      # INFO so a test run's rule evaluation and save errors show in `docker compose logs survey`.
      LOG_LEVEL: INFO
      brand.file.system.path: /opt/brand
      # Survey's connection is survey_user and its migrating connection elicit_owner; both
      # passwords are SURVEYPW in the database image's role script.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      quarkus.application.name: survey
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: survey
      OTEL_RESOURCE_ATTRIBUTES: service.name=survey,service.version=1.0,deployment.environment=site1
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
  pedigree:
    image: elicitsoftware/pedigree:${ELICIT_TAG:-latest}
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: elicit-e2e-service-token-multisite-site1
    ports:
      - 8083:8080
  admin:
    image: elicitsoftware/admin:${ELICIT_TAG:-latest}
    ports:
      - 8081:8080
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: elicit-e2e-service-token-multisite-site1
      TZ: America/Detroit
      quarkus.mailer.from: elicit@localhost
      quarkus.mailer.host: mailpit
      quarkus.mailer.port: 1025
      quarkus.mailer.tls: false
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      ELICIT_DB_PASSWORD: SAOWNERPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # Where the container reaches Keycloak. The browser never sees this address: Keycloak
      # answers with the public one, http://localhost:8180 (KC_HOSTNAME on the keycloak
      # service), so no host needs a hosts entry to sign in.
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/elicit/
      quarkus.application.name: admin
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: admin
      OTEL_RESOURCE_ATTRIBUTES: service.name=admin,service.version=1.0,deployment.environment=site1
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
      survey:
        condition: service_healthy
      pedigree:
        condition: service_started
  # Author stack: the `author` database is created by ../../db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql
  # on first initialization; author-survey creates the schema there and serves the preview.
  author-survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-latest}
    ports:
      - 8085:8080
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: elicit-e2e-service-token-multisite-site1
      TZ: America/Detroit
      accessCode.autoRegister: true
      elicit.etl.enabled: "false"
      elicit.etl.drop.enabled: "true"
      brand.file.system.path: /opt/brand
      # The preview connects as survey_user and migrates as elicit_owner, like Survey; the
      # roles are cluster-wide, so the author database takes the same passwords.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      quarkus.datasource.owner.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      quarkus.application.name: author-survey
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: author-survey
      OTEL_RESOURCE_ATTRIBUTES: service.name=author-survey,service.version=1.0,deployment.environment=site1
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
  author:
    image: elicitsoftware/author:${ELICIT_TAG:-latest}
    ports:
      - 8084:8080
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # The token the modules authenticate each other with. Every module of one site gets the
      # same value; a real site supplies its own (openssl rand -hex 32).
      ELICIT_SERVICE_TOKEN: elicit-e2e-service-token-multisite-site1
      # The preview Survey, which drops a survey's reporting schema before Author deletes it (UC-047).
      author.preview.survey.url: http://author-survey:8080
      # The preview as an author's browser opens it, for Reports > Preview in Survey… (Author UC-048 BR-007).
      author.preview.survey.public-url: http://localhost:8085
      TZ: America/Detroit
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      ELICIT_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # Where the container reaches Keycloak. The browser never sees this address: Keycloak
      # answers with the public one, http://localhost:8180 (KC_HOSTNAME on the keycloak
      # service), so no host needs a hosts entry to sign in.
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/elicit/
      quarkus.application.name: author
      quarkus.otel.enabled: true
      quarkus.otel.exporter.otlp.endpoint: http://jaeger:4317
      quarkus.otel.exporter.otlp.traces.endpoint: http://jaeger:4317
      quarkus.otel.traces.enabled: true
      quarkus.otel.metrics.enabled: true
      quarkus.otel.logs.enabled: true
      quarkus.datasource.jdbc.telemetry: true
      quarkus.otel.instrument.jdbc: true
      OTEL_SERVICE_NAME: author
      OTEL_RESOURCE_ATTRIBUTES: service.name=author,service.version=3.0.0,deployment.environment=site1
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
      author-survey:
        condition: service_healthy
  db:
    image: elicitsoftware/elicit_db:${ELICIT_TAG:-latest}
    volumes:
      - ../data/site1/PGDATA:/var/lib/postgresql/data
      - ../../db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql:/docker-entrypoint-initdb.d/V0.0.4__CREATE_AUTHOR_DATABASE.sql:ro
    ports:
      - 5452:5432
    environment:
      TZ: "America/Detroit"
      POSTGRES_USER: "survey"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey && psql -U survey -d survey -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  # Shared by both sites: site 2's Admin authenticates against this realm (its redirect URI
  # http://localhost:8031/* is listed in ../../keycloak/elicit-realm.json).
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    command: start-dev --import-realm --verbose -Dkeycloak.features=scripts
    ports:
      - "8180:8080"
    environment:
      TZ: "America/Detroit"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # The address a browser uses, which Keycloak puts in every sign-in redirect and names as
      # the issuer of its tokens. Every site's Admin (and Author here) calls it at
      # http://keycloak:8080; the second setting lets it answer those calls at the address they
      # came in on.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ../../keycloak:/opt/keycloak/data/import
      - ../data/site1/keycloak-h2:/h2
  # Shared by both sites: site 2's Admin joins this project's network and sends to `mailpit`.
  mailpit:
    image: axllent/mailpit:v1.34.0
    volumes:
      - ../data/site1/mailpit:/data
    ports:
      - 8025:8025
    environment:
      TZ: "America/Detroit"
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"
    environment:
      TZ: "America/Detroit"
      COLLECTOR_OTLP_ENABLED: "true"
