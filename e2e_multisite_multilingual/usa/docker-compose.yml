# USA - the master site of the multilingual multi-site e2e test (see ../README.md).
#
# A self-contained, trimmed copy of ../../docker-compose.yml (the umbrella's stack) on the stock
# host ports, with its own
# compose project name and its own data directories under ../data/usa so the test never touches the
# developer's postgresql/PGDATA. It cannot run at the same time as the umbrella's
# stack or ../../e2e_multisite (same ports). Differences from the umbrella's file:
#   - no fhhs and no pedigree here: the master runs the Census Household Survey only. The second
#     survey of the journey, the Family History Survey, is applied at Mexico (phases 17-19), and
#     that is where FHHS and Pedigree run -- see mexico/docker-compose.yml
#   - no sftpServer: FHHS runs without one (its SFTP upload is switched off)
#   - no jaeger and no OTLP exporters: this suite reads failures from screenshots and logs, and a
#     collector per site is three containers of no use to it
#   - no published ports for SMTP (1025): Admin reaches mailpit by service name
# Keycloak and Mailpit here are shared with Mexico and Arabia (see their compose files).
#
# This is the only site with Author: the master authors the survey, translates it and exports the
# definition the other two apply. The `author` database it and author-survey use is created by
# ../../db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql on first initialization of this site's db.
#
# The images carry English only; every site mounts the curated ../../elicit-i18n, and this
# site offers en of it (i18n.offered.locales).
# English only, so the language selector never appears -- which is what the journey asserts.
#
name: elicit-ml-usa

services:
  survey:
    image: elicitsoftware/survey:latest
    ports:
      - 8080:8080
    environment:
      TZ: America/Detroit
      accessCode.autoRegister: true
      # INFO so a test run's rule evaluation and save errors show in `docker compose logs survey`.
      LOG_LEVEL: INFO
      brand.file.system.path: /opt/brand
      # Survey's connection is survey_user and its migrating connection elicit_owner; both
      # passwords are SURVEYPW in the database image's role script.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # The image carries English only; the other languages are read from <this path>/<app>/,
      # the curated set every site here mounts. Of those, this site offers only these
      # (English is always offered).
      i18n.file.system.path: /opt/i18n
      i18n.offered.locales: en
      # A site holds a survey's translations for elicit.content.translations-ttl (5 minutes by
      # default) before reloading them, so an Admin apply surfaces "within this window without
      # a restart" -- which means a respondent who logs in just after an apply reads the base
      # language for every string whose translation changed in it. The journey applies a
      # revision and sends a respondent in seconds later, so it turns the window down rather
      # than sleeping through it. A real deployment keeps the default.
      elicit.content.translations-ttl: PT5S
      quarkus.application.name: survey
      # quarkus.otel.enabled is a build-time property: the runtime switch is this one.
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
  admin:
    image: elicitsoftware/admin:latest
    ports:
      - 8081:8080
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      TZ: America/Detroit
      quarkus.mailer.from: elicit-usa@localhost
      quarkus.mailer.host: mailpit
      quarkus.mailer.port: 1025
      quarkus.mailer.tls: false
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/,
      # the curated set every site here mounts. Of those, this site offers only these
      # (English is always offered).
      i18n.file.system.path: /opt/i18n
      i18n.offered.locales: en
      ELICIT_DB_PASSWORD: SAOWNERPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      quarkus.application.name: admin
      # quarkus.otel.enabled is a build-time property: the runtime switch is this one.
      quarkus.otel.sdk.disabled: "true"
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
      survey:
        condition: service_healthy
  # Author's preview instance: a second Survey pointed at the `author` database, with the reporting
  # ETL off (Author's database holds many surveys whose step names would collide in dim_step).
  author-survey:
    image: elicitsoftware/survey:latest
    ports:
      - 8085:8080
    environment:
      TZ: America/Detroit
      accessCode.autoRegister: true
      elicit.etl.enabled: "false"
      elicit.etl.drop.enabled: "true"
      brand.file.system.path: /opt/brand
      # The preview connects as survey_user and migrates as elicit_owner, like Survey; the
      # roles are cluster-wide, so the author database takes the same passwords.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # The image carries English only; the other languages are read from <this path>/<app>/,
      # the curated set every site here mounts. Of those, this site offers only these
      # (English is always offered).
      i18n.file.system.path: /opt/i18n
      i18n.offered.locales: en
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      quarkus.datasource.owner.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      # A site holds a survey's translations for elicit.content.translations-ttl (5 minutes by
      # default) before reloading them, so an Admin apply surfaces "within this window without
      # a restart" -- which means a respondent who logs in just after an apply reads the base
      # language for every string whose translation changed in it. The journey applies a
      # revision and sends a respondent in seconds later, so it turns the window down rather
      # than sleeping through it. A real deployment keeps the default.
      elicit.content.translations-ttl: PT5S
      quarkus.application.name: author-survey
      # quarkus.otel.enabled is a build-time property: the runtime switch is this one.
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
  author:
    image: elicitsoftware/author:latest
    ports:
      - 8084:8080
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # The preview Survey, which drops a survey's reporting schema before Author deletes it (UC-047).
      author.preview.survey.url: http://author-survey:8080
      TZ: America/Detroit
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/,
      # the curated set every site here mounts. Of those, this site offers only these
      # (English is always offered).
      i18n.file.system.path: /opt/i18n
      i18n.offered.locales: en
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      ELICIT_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # OIDC stays at the image default http://host.docker.internal:8180/realms/elicit/ (see the
      # note in ../../docker-compose.yml on why host.docker.internal is the right name).
      quarkus.application.name: author
      # quarkus.otel.enabled is a build-time property: the runtime switch is this one.
      quarkus.otel.sdk.disabled: "true"
    volumes:
      - ../../elicit-brand/:/opt/brand:ro
      - ../../elicit-i18n/:/opt/i18n:ro
    depends_on:
      db:
        condition: service_healthy
      author-survey:
        condition: service_healthy
  db:
    image: elicitsoftware/elicit_db:latest
    volumes:
      - ../data/usa/PGDATA:/var/lib/postgresql/data
      - ../../db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql:/docker-entrypoint-initdb.d/V0.0.4__CREATE_AUTHOR_DATABASE.sql:ro
    ports:
      - 5452:5432
    environment:
      TZ: "America/Detroit"
      POSTGRES_USER: "survey"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey && psql -U survey -d survey -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  # Shared by all three sites: Mexico's and Arabia's Admin authenticate against this realm, whose
  # redirect URIs include http://localhost:8031/* and http://localhost:7981/*
  # (../../keycloak/elicit-realm.json).
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    command: start-dev --import-realm --verbose -Dkeycloak.features=scripts
    ports:
      - "8180:8080"
    environment:
      TZ: "America/Detroit"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ../../keycloak:/opt/keycloak/data/import
      - ../data/usa/keycloak-h2:/h2
  # Shared by all three sites: their Admin containers join this project's network, so the service
  # name `mailpit` resolves there and SMTP stays unpublished.
  mailpit:
    image: axllent/mailpit
    volumes:
      - ../data/usa/mailpit:/data
    ports:
      - 8025:8025
    environment:
      TZ: "America/Detroit"
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
