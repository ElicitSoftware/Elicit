<?xml version="1.0" encoding="UTF-8"?>
<!-- Civil flag of Mexico: the plain green/white/red vertical tricolor, 4:7.
     The coat of arms is deliberately absent -- see ../README.md ("The flag
     artwork"): at the 48px header height it is an illegible smudge, and a
     hand-drawn approximation of a nationally regulated escudo is worse than
     none. Replace this file with official artwork to get the full flag. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 48" width="84" height="48" role="img" aria-label="Flag of Mexico">
  <rect x="0"  y="0" width="28" height="48" fill="#006847"/>
  <rect x="28" y="0" width="28" height="48" fill="#FFFFFF"/>
  <rect x="56" y="0" width="28" height="48" fill="#CE1126"/>
</svg>
